name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest
    container: archlinux/archlinux:base-devel

    steps:
    - uses: actions/checkout@v4
    - name: Install deps
      run: sudo pacman -Syu --needed --noconfirm  freetype2 fontconfig llvm clang rustup
    - name: Temporarily modify the rust toolchain version
      run: rustup update
    - name: Output rust version
      run: rustup --version
    - name: Output clang version
      run: clang --version
    - name: Cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    - name: Build
      run: cargo build --verbose
    - name: Upload release artifact
      uses: actions/upload-artifact@v4
      with:
        name: servus
        path: target/${{ matrix.BUILD_TARGET }}/servus
