name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  CC: clang-22
  CXX: clang++-22
  LIBCLANG_PATH: /usr/lib/llvm-22/lib
  BINDGEN_EXTRA_CLANG_ARGS: "--target=x86_64-unknown-linux-gnu"

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Temporarily modify the rust toolchain version
      run: rustup update
    - name: Output rust version
      run: rustup --version
    - name: Output clang version
      run: clang --version
    - name: Install deps
      run: sudo apt install -y libfreetype-dev libfreetype6 libfontconfig-dev fontconfig llvm-22 llvm-22-dev
    - name: Remove llvm-21
      run: sudo apt remove -y llvm-21
    - name: Output clang version
      run: clang --version
    - name: Cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    - name: Build
      run: cargo build --verbose
    - name: Upload release artifact
      uses: actions/upload-artifact@v4
      with:
        name: servus
        path: target/${{ matrix.BUILD_TARGET }}/servus
